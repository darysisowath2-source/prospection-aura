<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prospection AURA</title>
<style>
:root{
  --bg:#0f1117;--sb:#161b27;--sur:#1c2333;--bor:#2a3347;
  --tx:#e8ecf4;--mu:#8892a4;--ac:#6c7dff;--gr:#22c55e;
  --or:#f97316;--rd:#ef4444;--yw:#eab308;--bl:#38bdf8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);height:100vh;display:flex;flex-direction:column;font-size:13px;overflow:hidden}

/* ── NAV ── */
nav{display:flex;align-items:center;gap:4px;padding:0 16px;height:50px;background:var(--sb);border-bottom:1px solid var(--bor);flex-shrink:0;z-index:30}
.logo{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px;margin-right:14px;color:var(--tx)}
.logo-icon{width:26px;height:26px;background:var(--ac);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff}
.nav-btn{padding:5px 13px;border-radius:6px;cursor:pointer;color:var(--mu);border:none;background:none;font-size:13px;transition:all 150ms;position:relative}
.nav-btn:hover{background:var(--sur);color:var(--tx)}
.nav-btn.active{background:var(--sur);color:var(--tx)}
.nav-cnt{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;border-radius:9px;background:var(--ac);color:#fff;font-size:10px;font-weight:700;padding:0 5px;margin-left:5px;vertical-align:middle}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.sync-info{font-size:11px;color:var(--mu)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--mu);display:inline-block;margin-right:4px;transition:background 300ms}
.sync-dot.ok{background:var(--gr)}.sync-dot.err{background:var(--rd)}.sync-dot.ld{background:var(--yw);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.user-pill{font-size:11.5px;color:var(--mu);display:flex;align-items:center;gap:5px;cursor:pointer;padding:4px 10px;border-radius:6px;border:1px solid var(--bor)}
.user-pill:hover{background:var(--sur);color:var(--tx)}
.sf-group{display:flex;gap:3px}
.sf{padding:4px 11px;border-radius:16px;cursor:pointer;font-size:12px;border:1px solid var(--bor);background:transparent;color:var(--mu);transition:all 150ms}
.sf.active{background:var(--ac);border-color:var(--ac);color:#fff}
.sf.gr.active{background:var(--gr);border-color:var(--gr)}
.sf.or.active{background:var(--or);border-color:var(--or)}

/* ── LAYOUT ── */
.body{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
aside{width:196px;background:var(--sb);border-right:1px solid var(--bor);overflow-y:auto;flex-shrink:0;padding:10px 0}
.sb-title{padding:3px 14px 7px;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mu)}
.si{display:flex;align-items:center;justify-content:space-between;padding:6px 14px;cursor:pointer;transition:background 100ms;gap:5px}
.si:hover{background:var(--sur)}.si.active{background:rgba(108,125,255,.14);color:var(--ac)}
.si span{flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si-cnt{font-size:10.5px;color:var(--mu);flex-shrink:0}
.sb-sep{margin-top:14px;border-top:1px solid var(--bor);padding-top:10px}

/* ── VIEWS ── */
.view{display:none;flex:1;flex-direction:column;overflow:hidden}
.view.active{display:flex}

/* ── TOOLBAR ── */
.tb{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--bor);flex-shrink:0;flex-wrap:wrap}
.cnt{font-size:13px;color:var(--mu)}.cnt b{color:var(--tx)}
.sw{position:relative}
.sw svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.35;pointer-events:none}
#search{background:var(--sur);border:1px solid var(--bor);border-radius:7px;padding:5px 9px 5px 30px;color:var(--tx);width:180px;font-size:13px;outline:none}
#search:focus{border-color:var(--ac)}
select.fl{background:var(--sur);border:1px solid var(--bor);border-radius:7px;padding:5px 9px;color:var(--tx);font-size:12px;cursor:pointer;outline:none}
.btn{padding:5px 11px;border-radius:7px;border:1px solid var(--bor);background:transparent;color:var(--mu);font-size:12px;cursor:pointer}
.btn:hover{background:var(--sur);color:var(--tx)}
.btn.blue{border-color:var(--ac);color:var(--ac)}.btn.blue:hover{background:rgba(108,125,255,.12)}

/* ── TABLE ── */
.tw{flex:1;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
thead{position:sticky;top:0;background:var(--sur);z-index:10}
th{padding:9px 13px;text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);border-bottom:1px solid var(--bor);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--tx)}
th .sort-arrow{margin-left:4px;opacity:.4;font-size:9px}
th.sorted .sort-arrow{opacity:1;color:var(--ac)}
td{padding:9px 13px;border-bottom:1px solid rgba(42,51,71,.5);vertical-align:middle}
tr.prospect-row{cursor:pointer}
tr.prospect-row:hover td{background:rgba(255,255,255,.025)}
tr.mine td{background:rgba(108,125,255,.04)}
.nom{font-weight:600;color:var(--tx);max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;padding:1.5px 6px;border-radius:9px;font-size:10px;background:rgba(108,125,255,.15);color:var(--ac);margin-top:2px}
.tel-a{color:var(--tx);text-decoration:none;font-family:monospace;font-size:12px}
.tel-a:hover{color:var(--ac)}
.em-a{color:var(--mu);font-size:11.5px;text-decoration:none;max-width:150px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.em-a:hover{color:var(--ac)}
.site-a{color:var(--gr);font-size:11.5px;text-decoration:none;max-width:140px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.site-a:hover{text-decoration:underline}
.no-site{color:var(--bor);font-size:11px}
.dep-b{display:inline-block;font-size:9.5px;padding:1px 5px;border-radius:3px;background:rgba(255,255,255,.07);color:var(--mu);margin-top:2px}
.score-b{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:5px;font-size:11px;font-weight:700;margin-left:6px}
.sc-r{background:rgba(239,68,68,.2);color:var(--rd)}
.sc-o{background:rgba(249,115,22,.2);color:var(--or)}
.sc-g{background:rgba(34,197,94,.2);color:var(--gr)}
.sc-n{background:rgba(255,255,255,.06);color:var(--mu)}
.closed-tag{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;background:rgba(239,68,68,.18);color:var(--rd);vertical-align:middle;margin-left:4px;letter-spacing:.04em}
/* statut */
.st{border:none;border-radius:5px;padding:3px 9px;font-size:11px;cursor:pointer;font-weight:500;transition:all 100ms;white-space:nowrap}
.st-none{background:var(--sur);color:var(--mu);border:1px solid var(--bor)}.st-none:hover{border-color:var(--ac);color:var(--ac)}
.st-contacte{background:rgba(234,179,8,.14);color:var(--yw);border:1px solid rgba(234,179,8,.3)}
.st-interesse{background:rgba(56,189,248,.14);color:var(--bl);border:1px solid rgba(56,189,248,.3)}
.st-devis{background:rgba(249,115,22,.14);color:var(--or);border:1px solid rgba(249,115,22,.3)}
.st-signe{background:rgba(34,197,94,.14);color:var(--gr);border:1px solid rgba(34,197,94,.3)}
.st-non{background:rgba(239,68,68,.1);color:var(--rd);border:1px solid rgba(239,68,68,.2)}
.by-txt{font-size:9px;color:var(--mu);display:block;margin-top:2px}
/* note */
.note-btn{background:none;border:none;cursor:pointer;color:var(--mu);font-size:14px;padding:2px 5px;border-radius:4px;line-height:1}
.note-btn:hover{background:var(--sur)}.note-btn.has-note{color:var(--yw)}
/* assign select */
select.assign{background:var(--sur);border:1px solid var(--bor);border-radius:5px;padding:3px 7px;color:var(--tx);font-size:11px;cursor:pointer;outline:none}
.empty{text-align:center;padding:50px;color:var(--mu)}

/* ── TOOLTIP ── */
.tooltip{position:absolute;background:#0a0d14;border:1px solid var(--bor);border-radius:7px;padding:8px 12px;font-size:11.5px;color:var(--tx);z-index:100;pointer-events:none;min-width:160px;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.tooltip-row{margin:2px 0;color:var(--mu)}.tooltip-row b{color:var(--tx)}

/* ── NOTE POPOVER ── */
.note-pop{position:fixed;background:var(--sur);border:1px solid var(--bor);border-radius:9px;padding:12px;width:260px;z-index:200;box-shadow:0 8px 30px rgba(0,0,0,.6)}
.note-pop textarea{width:100%;background:var(--bg);border:1px solid var(--bor);border-radius:6px;padding:8px;color:var(--tx);font-size:12.5px;resize:vertical;min-height:80px;outline:none;font-family:inherit}
.note-pop textarea:focus{border-color:var(--ac)}
.note-pop-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.pop-save-info{font-size:10.5px;color:var(--mu)}

/* ── DRAWER ── */
.drawer{position:fixed;right:-420px;top:0;bottom:0;width:420px;background:var(--sb);border-left:1px solid var(--bor);z-index:50;transition:right 280ms cubic-bezier(.2,.8,.2,1);overflow-y:auto;display:flex;flex-direction:column}
.drawer.open{right:0}
.drawer-head{display:flex;align-items:flex-start;justify-content:space-between;padding:20px;border-bottom:1px solid var(--bor);flex-shrink:0}
.drawer-head h3{font-size:17px;font-weight:700;line-height:1.3}
.close-btn{background:none;border:none;color:var(--mu);cursor:pointer;font-size:20px;line-height:1;padding:4px;border-radius:6px}
.close-btn:hover{background:var(--sur);color:var(--tx)}
.drawer-body{padding:20px;flex:1}
.d-sect{margin-bottom:20px}
.d-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin-bottom:8px}
.d-val{font-size:14px;color:var(--tx)}
.d-val a{color:var(--ac);text-decoration:none}.d-val a:hover{text-decoration:underline}
.d-row{display:flex;gap:16px;margin-bottom:12px}
.d-field{flex:1}
.hist-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid rgba(42,51,71,.4);align-items:flex-start}
.hist-item:last-child{border-bottom:none}
.hist-dot{width:8px;height:8px;border-radius:50%;background:var(--ac);flex-shrink:0;margin-top:4px}
.hist-text{font-size:12px;color:var(--mu);flex:1}.hist-text b{color:var(--tx)}
.hist-time{font-size:10.5px;color:var(--mu);flex-shrink:0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:49;display:none}
.overlay.show{display:block}

/* ── KANBAN ── */
.kanban{display:flex;gap:12px;padding:14px;overflow-x:auto;flex:1;align-items:flex-start}
.k-col{background:var(--sur);border:1px solid var(--bor);border-radius:9px;width:220px;min-width:220px;display:flex;flex-direction:column;max-height:calc(100vh - 130px)}
.k-col.drag-over{border-color:var(--ac);background:rgba(108,125,255,.07)}
.k-head{padding:11px 13px 9px;border-bottom:1px solid var(--bor);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.k-title{font-size:12.5px;font-weight:600}
.k-badge{font-size:10.5px;color:var(--mu);background:rgba(255,255,255,.07);padding:1px 7px;border-radius:10px}
.k-cards{overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:7px;flex:1}
.k-card{background:var(--sb);border:1px solid var(--bor);border-radius:7px;padding:10px 12px;cursor:grab;transition:all 150ms}
.k-card:hover{border-color:var(--ac);transform:translateY(-1px)}
.k-card.dragging{opacity:.4;cursor:grabbing}
.k-nom{font-weight:600;font-size:12.5px;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-tel{font-size:12px;font-family:monospace;color:var(--mu)}.k-tel a{color:var(--mu);text-decoration:none}.k-tel a:hover{color:var(--ac)}
.k-meta{display:flex;align-items:center;justify-content:space-between;margin-top:7px}
.k-dep{font-size:10px;color:var(--mu);background:rgba(255,255,255,.06);padding:1px 5px;border-radius:3px}
.k-by{font-size:10px;color:var(--mu)}
.k-empty{text-align:center;padding:20px;color:var(--mu);font-size:12px}
.k-more{font-size:11px;color:var(--ac);text-align:center;padding:6px;cursor:pointer}
.k-more:hover{text-decoration:underline}

/* ── HISTORIQUE ── */
.hist-table{flex:1;overflow:auto}
.hist-table table{width:100%;border-collapse:collapse}
.hist-table td{padding:10px 14px;border-bottom:1px solid rgba(42,51,71,.4);font-size:13px}
.hist-table tr:hover td{background:rgba(255,255,255,.02)}
.hist-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}

/* ── MODAL ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--sur);border:1px solid var(--bor);border-radius:12px;padding:28px;width:320px;text-align:center}
.modal h3{margin-bottom:7px;font-size:16px}
.modal p{color:var(--mu);font-size:12.5px;margin-bottom:18px;line-height:1.5}
.modal input{width:100%;background:var(--bg);border:1px solid var(--bor);border-radius:7px;padding:9px 13px;color:var(--tx);font-size:14px;outline:none;margin-bottom:13px}
.modal input:focus{border-color:var(--ac)}
.modal .ok-btn{width:100%;background:var(--ac);border:none;border-radius:7px;padding:10px;color:#fff;font-size:14px;font-weight:600;cursor:pointer}

@media(max-width:768px){aside{display:none}.nom{max-width:120px}}

/* ── Priorite / cibles chaudes ── */
.heat{display:inline-flex;align-items:center;gap:2px;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;vertical-align:middle;margin-left:5px}
.heat-hot{background:rgba(239,68,68,.18);color:#ff6b6b}
.heat-warm{background:rgba(249,115,22,.16);color:var(--or)}
.heat-cold{background:rgba(255,255,255,.06);color:var(--mu)}
.btn.fire{border-color:#ff6b6b;color:#ff6b6b}
.btn.fire.active{background:#ff6b6b;color:#fff;border-color:#ff6b6b}
.btn.next{background:var(--gr);border-color:var(--gr);color:#06240f;font-weight:600}
.btn.next:hover{background:#16a34a}

/* ── Boutons issue rapide (drawer) ── */
.outcomes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.oc{border:1px solid var(--bor);background:var(--sur);color:var(--tx);border-radius:7px;padding:8px 12px;font-size:12.5px;cursor:pointer;font-weight:500;transition:all 120ms}
.oc:hover{transform:translateY(-1px)}
.oc.rep:hover{border-color:var(--mu)}
.oc.no:hover{border-color:var(--rd);color:var(--rd)}
.oc.rappel:hover{border-color:var(--yw);color:var(--yw)}
.oc.int:hover{border-color:var(--bl);color:var(--bl)}
.oc.dev:hover{border-color:var(--or);color:var(--or)}
.oc.sign:hover{border-color:var(--gr);color:var(--gr)}
.oc.active-rep{background:rgba(136,146,164,.2)}
.rappel-quick{display:flex;gap:6px;margin-top:6px}
.rq{border:1px solid var(--bor);background:none;color:var(--mu);border-radius:6px;padding:5px 10px;font-size:11.5px;cursor:pointer}
.rq:hover{border-color:var(--yw);color:var(--yw)}
.copy-msg{width:100%;margin-top:8px;border:1px solid var(--ac);background:rgba(108,125,255,.1);color:var(--ac);border-radius:7px;padding:9px;font-size:12.5px;cursor:pointer;font-weight:500}
.copy-msg:hover{background:rgba(108,125,255,.2)}

/* ── Rappel badge nav ── */
.nav-cnt.warn{background:var(--yw);color:#3a2e00}

/* ── KPI dashboard ── */
.kpi-wrap{flex:1;overflow:auto;padding:20px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.kpi-card{background:var(--sur);border:1px solid var(--bor);border-radius:10px;padding:16px 18px}
.kpi-val{font-size:30px;font-weight:700;line-height:1}
.kpi-lbl{font-size:11px;color:var(--mu);margin-top:6px;text-transform:uppercase;letter-spacing:.08em}
.kpi-sub{font-size:11px;color:var(--mu);margin-top:4px}
.kpi-section-title{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin:18px 0 10px}
.funnel{display:flex;flex-direction:column;gap:6px;max-width:540px}
.funnel-row{display:flex;align-items:center;gap:10px}
.funnel-bar{height:26px;border-radius:5px;display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:600;color:#fff;min-width:40px;transition:width 400ms}
.funnel-lbl{width:130px;font-size:12.5px;color:var(--tx)}
.kpi-table{width:100%;border-collapse:collapse;max-width:600px}
.kpi-table th,.kpi-table td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--bor);font-size:12.5px}
.kpi-table th{color:var(--mu);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em}

/* ── MODE APPEL ── */
.call-overlay{display:none;position:fixed;inset:0;background:rgba(10,13,20,.96);z-index:300;flex-direction:column;align-items:center;justify-content:flex-start;padding:24px;overflow-y:auto}
.call-overlay.show{display:flex}
.call-top{width:100%;max-width:720px;display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.call-progress{font-size:13px;color:var(--mu)}
.call-progress b{color:var(--tx)}
.call-close{background:none;border:1px solid var(--bor);color:var(--mu);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:13px}
.call-close:hover{background:var(--sur);color:var(--tx)}
.call-card{width:100%;max-width:720px;background:var(--sur);border:1px solid var(--bor);border-radius:16px;padding:30px 32px}
.call-sec{display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ac);background:rgba(108,125,255,.12);padding:3px 10px;border-radius:12px;margin-bottom:12px}
.call-nom{font-size:30px;font-weight:700;line-height:1.1;margin-bottom:6px}
.call-meta{color:var(--mu);font-size:14px;margin-bottom:20px}
.call-tel{display:flex;align-items:center;gap:12px;background:var(--bg);border:1px solid var(--bor);border-radius:12px;padding:16px 20px;margin-bottom:16px}
.call-tel a{font-size:26px;font-weight:700;font-family:monospace;color:var(--gr);text-decoration:none}
.call-tel .call-cta{margin-left:auto;background:var(--gr);color:#06240f;border:none;border-radius:10px;padding:12px 20px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none}
.call-info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.call-info-item{background:var(--bg);border:1px solid var(--bor);border-radius:9px;padding:10px 13px}
.call-info-item .k{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
.call-info-item .v{font-size:14px;margin-top:3px}
.call-info-item .v a{color:var(--ac);text-decoration:none}
.call-script{background:var(--bg);border:1px dashed var(--bor);border-radius:10px;padding:14px;font-size:13.5px;line-height:1.5;color:var(--tx);margin-bottom:18px}
.call-script .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--mu);margin-bottom:6px}
.call-outcomes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.call-oc{border:1px solid var(--bor);background:var(--bg);color:var(--tx);border-radius:10px;padding:14px;font-size:13.5px;font-weight:600;cursor:pointer;transition:all 120ms}
.call-oc:hover{transform:translateY(-1px);border-color:var(--ac)}
.call-oc.rep:hover{border-color:var(--mu)}
.call-oc.no:hover{border-color:var(--rd);color:var(--rd)}
.call-oc.rappel:hover{border-color:var(--yw);color:var(--yw)}
.call-oc.int:hover{border-color:var(--bl);color:var(--bl)}
.call-oc.dev:hover{border-color:var(--or);color:var(--or)}
.call-oc.sign:hover{border-color:var(--gr);color:var(--gr)}
.call-skip{width:100%;max-width:720px;margin-top:12px;background:none;border:1px solid var(--bor);color:var(--mu);border-radius:10px;padding:11px;cursor:pointer;font-size:13px}
.call-skip:hover{background:var(--sur);color:var(--tx)}
.call-done{text-align:center;color:var(--mu);padding:40px}

<!-- MODAL -->
<div class="modal-overlay show" id="modal">
  <div class="modal">
    <h3>Bienvenue</h3>
    <p>Ton prenom pour que ton equipe sache qui demarre quoi.</p>
    <input type="text" id="inp-user" placeholder="Ex: Dary" maxlength="30" autocomplete="off" onkeydown="if(event.key==='Enter')saveUser()">
    <button class="ok-btn" onclick="saveUser()">Continuer</button>
  </div>
</div>

<!-- OVERLAY DRAWER -->
<div class="overlay" id="overlay" onclick="closeDrawer()"></div>

<!-- DRAWER -->
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h3 id="dr-nom">—</h3>
    <button class="close-btn" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-body" id="dr-body"></div>
</div>

<!-- NOTE POPOVER -->
<div class="note-pop" id="note-pop" style="display:none">
  <textarea id="note-ta" placeholder="Note sur ce prospect..." rows="4"></textarea>
  <div class="note-pop-footer">
    <span class="pop-save-info" id="pop-save-info">Sauvegarde auto</span>
    <button class="btn" onclick="closeNotePop()">Fermer</button>
  </div>
</div>

<!-- TOOLTIP -->
<div class="tooltip" id="tooltip" style="display:none"></div>

<!-- MODE APPEL -->
<div class="call-overlay" id="call-overlay">
  <div class="call-top">
    <div class="call-progress">Session : <b id="call-done">0</b> traités · <b id="call-left">0</b> à appeler</div>
    <button class="call-close" onclick="closeCallMode()">✕ Quitter</button>
  </div>
  <div id="call-body" style="width:100%;display:flex;flex-direction:column;align-items:center"></div>
</div>

<!-- NAV -->
<nav>
  <div class="logo"><div class="logo-icon">V</div>Prospection</div>
  <button class="nav-btn active" onclick="showView('prospects',this)" id="btn-prospects">
    Prospects<span class="nav-cnt" id="cnt-prospects">753</span>
  </button>
  <button class="nav-btn" onclick="showView('pipeline',this)" id="btn-pipeline">
    Pipeline<span class="nav-cnt" id="cnt-pipeline">0</span>
  </button>
  <button class="nav-btn" onclick="showView('stats',this)" id="btn-stats">
    Stats
  </button>
  <button class="nav-btn" onclick="showView('historique',this)" id="btn-hist">
    Historique
  </button>
  <button class="btn call" style="margin-left:12px" onclick="openCallMode()">▶ Mode Appel</button>
  <button class="btn next" onclick="nextToCall()">Prochain</button>
  <div class="sf-group" style="margin-left:10px">
    <button class="sf active" onclick="setSF('all')">Tous</button>
    <button class="sf gr" onclick="setSF('without')">Sans site</button>
    <button class="sf or" onclick="setSF('with')">Avec site</button>
  </div>
  <div class="nav-right">
    <span class="sync-info"><span class="sync-dot" id="sdot"></span><span id="sync-txt">—</span></span>
    <div class="user-pill" onclick="changeUser()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      <span id="user-lbl">...</span>
    </div>
  </div>
</nav>

// Score de priorite 0-10 : pire site + secteur premium + mobile + non traite = chaud
function priority(r){
  const d=sbData[r.id]||{}, en=enrichData[r.id]||{};
  if(en.etat==="Fermee") return -1;
  let p=0;
  if(!r.has) p+=3;
  else if(d.score!=null){ if(d.score<=3)p+=4; else if(d.score<=6)p+=2; }
  else p+=2;
  if(PREMIUM.includes(r.sec)) p+=2;
  if(/^0[67]/.test(r.tel)) p+=1;
  const st=d.s||"none";
  if(st==="none") p+=1; else if(st==="non"||st==="signe") p-=5;
  return p;
}
// Parse le CA enrichi ("1.2M EUR" / "450k EUR") en nombre pour le tri
function caNum(id){
  const ca=(enrichData[id]||{}).ca; if(!ca) return -1;
  const m=String(ca).match(/([\d.,]+)\s*([Mk]?)/);
  if(!m) return -1;
  let n=parseFloat(m[1].replace(",",".")); if(isNaN(n)) return -1;
  if(m[2]==="M") n*=1e6; else if(m[2]==="k") n*=1e3;
  return n;
}
function heatBadge(r){
  const p=priority(r);
  if(p>=6) return "<span class='heat heat-hot'>🔥 "+p+"</span>";
  if(p>=4) return "<span class='heat heat-warm'>"+p+"</span>";
  return "<span class='heat heat-cold'>"+p+"</span>";
}

function sbH(){ return {apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json",Prefer:"return=representation"}; }

async function loadAll(){
  setDot("ld");
  try{
    const r = await fetch(SB_URL+"/rest/v1/prospects_statuts?select=prospect_id,statut,updated_by,updated_at,site_score,note,assigned_to,rappel_at",{headers:sbH()});
    if(!r.ok) throw r.status;
    const rows = await r.json();
    rows.forEach(row => {
      sbData[row.prospect_id] = {s:row.statut||"none",by:row.updated_by||"",at:row.updated_at,score:row.site_score,note:row.note||"",assigned:row.assigned_to||"",rappel:row.rappel_at||""};
    });
    lastSync = new Date();
    updateSyncInfo();
    setDot("ok");
    render(); renderPipeline(); updateNavCnt();
  }catch(e){ console.error(e); setDot("err"); }
}

async function upsert(id, patch){
  const cur = sbData[id]||{};
  const payload = {prospect_id:id, statut:cur.s||"none", updated_by:cur.by||"", ...patch};
  const r = await fetch(SB_URL+"/rest/v1/prospects_statuts",{method:"POST",headers:{...sbH(),Prefer:"resolution=merge-duplicates"},body:JSON.stringify(payload)});
  if(!r.ok) throw r.status;
  sbData[id] = {...(sbData[id]||{}), ...patch};
}

async function addHist(id, action){
  await fetch(SB_URL+"/rest/v1/prospects_historique",{method:"POST",headers:{...sbH(),Prefer:"return=minimal"},

}

async function changeStatut(id, st){

}

// ── SUPABASE REALTIME WebSocket ─────────────────────────────────────────
function connectRealtime(){
  if(rtWs && rtWs.readyState < 2) return;
  const wsUrl = SB_URL.replace("https://","wss://")+"/realtime/v1/websocket?apikey="+SB_KEY+"&vsn=1.0.0";
  rtWs = new WebSocket(wsUrl);

  rtWs.onopen = ()=>{
    rtWs.send(JSON.stringify({
      event:"phx_join",
      topic:"realtime:public:prospects_statuts",
      payload:{config:{broadcast:{self:false},postgres_changes:[{event:"*",schema:"public",table:"prospects_statuts"}]}},
      ref:"1", join_ref:"1"
    }));
  };

  rtWs.onmessage = e=>{
    const msg = JSON.parse(e.data);
    // Confirme que le canal est joint
    if(msg.event==="phx_reply"&&msg.payload&&msg.payload.status==="ok"){
      setDot("ok");
      document.getElementById("sync-txt").textContent="Temps reel";
    }
    // Changement en base
    if(msg.event==="postgres_changes"){
      const rec = msg.payload&&msg.payload.data&&msg.payload.data.record;
      if(rec){
        sbData[rec.prospect_id]={
          s:rec.statut||"none", by:rec.updated_by||"", at:rec.updated_at,
          score:rec.site_score, note:rec.note||"", assigned:rec.assigned_to||""
        };
        lastSync=new Date(); setDot("ok");
        render(); renderPipeline(); updateNavCnt();
      }
    }
  };

  // Heartbeat Phoenix toutes les 25s
  const hb = setInterval(()=>{
    if(rtWs.readyState===1) rtWs.send(JSON.stringify({event:"heartbeat",topic:"phoenix",payload:{},ref:null}));
    else clearInterval(hb);
  }, 25000);

  rtWs.onclose = ()=>{ setDot("err"); setTimeout(connectRealtime, 3000); };
  rtWs.onerror = ()=>rtWs.close();
}

  const msg="Bonjour, je suis "+userName+" de Veridian, on crée des sites internet pour les commerces. J'ai vu que "+(r.nom||"votre établissement")+" n'avait pas de site à jour, je peux vous en faire un sur mesure. Quand puis-je vous rappeler ? "+userName;
  navigator.clipboard.writeText(msg).then(()=>{ const b=document.getElementById("call-copy"); if(b){b.textContent="Copié ✓";setTimeout(()=>b.textContent="Copier l'accroche",1500);} });
}
function callOutcome(status){
  const r=callQueue[callIdx]; if(!r) return;
  if(status==="rep"){ addHist(r.id,"Répondeur / pas de réponse"); }
  else if(status==="rappel"){ setRappel(r.id,3); }
  else { changeStatut(r.id,status); }
  callDone++; callIdx++; renderCallCard();
}
function callSkip(){ callIdx++; renderCallCard(); }

function setRappel(id, days){
  const d=new Date(); d.setDate(d.getDate()+days); d.setHours(10,0,0,0);
  upsert(id, {rappel_at:d.toISOString(), updated_by:userName}).then(()=>{
    sbData[id]={...(sbData[id]||{}), rappel:d.toISOString()};
    addHist(id, "Rappel programmé "+d.toLocaleDateString("fr-FR"));
    setDot("ok"); render(); updateNavCnt();
  });
}

function copyMsg(id){
  const r=ALL.find(p=>p.id===id);
  const msg="Bonjour, "+(r&&r.nom?r.nom:"")+". Je suis "+userName+" de Veridian, on crée des sites internet pour les commerces. J'ai vu que vous n'aviez pas (ou plus) de site à jour, je peux vous en faire un sur mesure. Quand puis-je vous rappeler ? "+userName;
  navigator.clipboard.writeText(msg).then(()=>{
    const b=document.getElementById("copy-msg-btn"); if(b){ b.textContent="Copié ✓"; setTimeout(()=>b.textContent="Copier un message d'accroche",1500); }
  });
}

// ── STATS / KPI ──
function renderStats(){
  const rows=Object.entries(sbData);
  const cnt={none:0,contacte:0,interesse:0,devis:0,signe:0,non:0};
  const perUser={};
  rows.forEach(([id,d])=>{
    const s=d.s||"none"; if(cnt[s]!=null) cnt[s]++;
    if(d.by && s!=="none"){ perUser[d.by]=perUser[d.by]||{traite:0,signe:0,interesse:0,devis:0}; perUser[d.by].traite++;
      if(s==="signe")perUser[d.by].signe++; if(s==="interesse")perUser[d.by].interesse++; if(s==="devis")perUser[d.by].devis++; }
  });
  const traites=cnt.contacte+cnt.interesse+cnt.devis+cnt.signe+cnt.non;
  const interesses=cnt.interesse+cnt.devis+cnt.signe;
  const tauxInt = traites? Math.round(interesses/traites*100):0;
  const tauxSign = traites? Math.round(cnt.signe/traites*100):0;
  const caPotentiel=(cnt.interesse+cnt.devis)*400, caSigne=cnt.signe*400;
  const fmax=Math.max(traites,cnt.none,1);
  const fbar=(label,color,n)=>`<div class='funnel-row'><span class='funnel-lbl'>${label}</span><div class='funnel-bar' style='width:${Math.max(Math.round(n/fmax*100),6)}%;background:${color}'>${n}</div></div>`;
  let usersHtml="";
  Object.entries(perUser).sort((a,b)=>b[1].signe-a[1].signe).forEach(([u,s])=>{
    usersHtml+=`<tr><td><b>${u}</b></td><td>${s.traite}</td><td>${s.interesse}</td><td>${s.devis}</td><td style='color:var(--gr)'>${s.signe}</td></tr>`;
  });
  document.getElementById("kpi-wrap").innerHTML=`
    <div class='kpi-grid'>
      <div class='kpi-card'><div class='kpi-val'>${ALL.length}</div><div class='kpi-lbl'>Prospects</div></div>
      <div class='kpi-card'><div class='kpi-val'>${traites}</div><div class='kpi-lbl'>Traités</div><div class='kpi-sub'>${ALL.length-traites} restants</div></div>
      <div class='kpi-card'><div class='kpi-val' style='color:var(--bl)'>${tauxInt}%</div><div class='kpi-lbl'>Taux d'intérêt</div><div class='kpi-sub'>${interesses} intéressés</div></div>
      <div class='kpi-card'><div class='kpi-val' style='color:var(--gr)'>${cnt.signe}</div><div class='kpi-lbl'>Signés</div><div class='kpi-sub'>${tauxSign}% de transfo</div></div>
      <div class='kpi-card'><div class='kpi-val' style='color:var(--gr)'>${caSigne}€</div><div class='kpi-lbl'>CA signé</div><div class='kpi-sub'>+${caPotentiel}€ en cours</div></div>
    </div>
    <div class='kpi-section-title'>Entonnoir</div>
    <div class='funnel'>
      ${fbar('À contacter','#8892a4',cnt.none)}
      ${fbar('Contactés','#eab308',cnt.contacte)}
      ${fbar('Intéressés','#38bdf8',cnt.interesse)}
      ${fbar('Devis envoyés','#f97316',cnt.devis)}
      ${fbar('Signés','#22c55e',cnt.signe)}
      ${fbar('Pas intéressés','#ef4444',cnt.non)}
    </div>
    <div class='kpi-section-title'>Par personne</div>
    <table class='kpi-table'><thead><tr><th>Membre</th><th>Traités</th><th>Intéressés</th><th>Devis</th><th>Signés</th></tr></thead><tbody>${usersHtml||"<tr><td colspan=5 style='color:var(--mu)'>Aucune action encore.</td></tr>"}</tbody></table>
  `;
}

function resetFilters(){
  sfFilter="all"; secFilter=""; sortCol=""; sortAsc=true; page=0; hotMode=false;
  document.getElementById("hot-btn").classList.remove("active");
  document.getElementById("hot-btn").textContent="Cibles chaudes";
  document.getElementById("search").value="";
  document.getElementById("dep-sel").value="";
  document.getElementById("st-sel").value="";
  document.getElementById("assign-sel").value="";
  document.getElementById("score-sel").value="";
  document.querySelectorAll(".si").forEach(e=>e.classList.remove("active"));
  document.querySelectorAll(".sf").forEach((b,i)=>b.classList.toggle("active",i===0));
  render(); renderPipeline();
}

function getFiltered(){
  const q=document.getElementById("search").value.toLowerCase();
  const dep=document.getElementById("dep-sel").value;
  const sf=document.getElementById("st-sel").value;
  const asgn=document.getElementById("assign-sel").value;
  const sc=document.getElementById("score-sel").value;
  let data = ALL.filter(r=>{
    if(sfFilter==="with" && !r.has) return false;
    if(sfFilter==="without" && r.has) return false;
    if(secFilter && r.sec!==secFilter) return false;
    if(dep && r.dep!==dep) return false;
    if(hideClosed && (enrichData[r.id]||{}).etat==="Fermee") return false;
    const d=sbData[r.id]||{};
    const st=d.s||"none";
    if(sf==="rappel"){ if(!d.rappel) return false; }
    else if(sf && st!==sf) return false;
    if(asgn==="mine" && d.assigned!==userName) return false;
    if(sc){
      const s=d.score;
      // null = pas encore score : inclus dans "bad" uniquement (cible par defaut)
      if(sc==="bad" && s!=null && s>3) return false;
      if(sc==="mid" && (s==null||s<4||s>6)) return false;
      if(sc==="good" && (s==null||s<7)) return false;
      if(sc==="unscored" && s!=null) return false;
    }
    if(hotMode){
      if((d.s||"none")!=="none") return false;
      if((enrichData[r.id]||{}).etat==="Fermee") return false;
      if(priority(r)<4) return false;
    }
    if(q && !((r.nom+r.ville+r.type+r.tel+r.dep).toLowerCase().includes(q))) return false;
    return true;
  });
  if(hotMode){
    data = [...data].sort((a,b)=>priority(b)-priority(a));
  } else if(sortCol){
    data = [...data].sort((a,b)=>{
      let va,vb;
      if(sortCol==="nom"){ va=a.nom.toLowerCase(); vb=b.nom.toLowerCase(); }
      else if(sortCol==="tel"){ va=a.tel; vb=b.tel; }
      else if(sortCol==="ville"){ va=a.ville.toLowerCase(); vb=b.ville.toLowerCase(); }
      else if(sortCol==="score"){ va=(sbData[a.id]||{}).score??-1; vb=(sbData[b.id]||{}).score??-1; }
      else if(sortCol==="ca"){ va=caNum(a.id); vb=caNum(b.id); }
      return sortAsc ? (va>vb?1:-1) : (va<vb?1:-1);
    });
  }
  return data;
}

function scoreBadge(s){
  if(s==null) return "<span class='score-b sc-n'>?</span>";
  const cls=s<=3?"sc-r":s<=6?"sc-o":"sc-g";
  return "<span class='score-b "+cls+"'>"+s+"</span>";
}

function render(){
  const data=getFiltered();
  document.getElementById("count").textContent=data.length;
  document.getElementById("cnt-prospects").textContent=data.length;
  const tb=document.getElementById("tbody");
  const empty=document.getElementById("empty");
  if(!data.length){ tb.innerHTML=""; empty.style.display=""; renderPager(0,0); return; }
  empty.style.display="none";
  const total=data.length;
  const start=page*PAGE_SZ;
  const slice=data.slice(start, start+PAGE_SZ);
  tb.innerHTML=slice.map(rowHTML).join("");
  renderPager(total, start+slice.length);
}

function renderPager(total, shown){
  let el=document.getElementById("pager");
  if(!el){ el=document.createElement("div"); el.id="pager"; el.style.cssText="display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;flex-shrink:0;border-top:1px solid var(--bor);font-size:12px;color:var(--mu)"; document.getElementById("view-prospects").appendChild(el); }
  if(total<=PAGE_SZ){ el.innerHTML=""; return; }
  const pages=Math.ceil(total/PAGE_SZ);
  el.innerHTML=(page>0?"<button class='btn' onclick='goPage("+(page-1)+")'>← Précédent</button>":"")
    +"<span>Page "+(page+1)+" / "+pages+" · "+shown+" / "+total+" prospects</span>"
    +(page<pages-1?"<button class='btn' onclick='goPage("+(page+1)+")'>Suivant →</button>":"");
}
function goPage(p){ page=p; render(); document.querySelector(".tw").scrollTop=0; }

// ── RENDER PIPELINE ───────────────────────────────────────────────────────
function renderPipeline(){
  const kanban=document.getElementById("kanban");
  kanban.innerHTML="";
  let pipeCount=0;
  COLS.forEach(col=>{
    let cards=ALL.filter(r=>{
      const d=sbData[r.id]||{};
      const st=d.s||"none";
      if(st!==col.id) return false;
      if(sfFilter==="with" && !r.has) return false;
      if(sfFilter==="without" && r.has) return false;
      return true;
    });
    if(col.id!=="none") pipeCount+=cards.length;
    const MAX=col.id==="none"?80:999;
    const div=document.createElement("div");
    div.className="k-col";
    div.dataset.statut=col.id;
    div.innerHTML="<div class='k-head'><span class='k-title' style='color:"+col.color+"'>"+col.label+"</span><span class='k-badge'>"+cards.length+"</span></div><div class='k-cards' id='kc-"+col.id+"'></div>";
    div.addEventListener("dragover",e=>{ e.preventDefault(); div.classList.add("drag-over"); });
    div.addEventListener("dragleave",()=>div.classList.remove("drag-over"));
    div.addEventListener("drop",e=>{ e.preventDefault(); div.classList.remove("drag-over"); const id=+e.dataTransfer.getData("pid"); changeStatut(id,col.id); });
    kanban.appendChild(div);
    const container=div.querySelector(".k-cards");
    const shown=cards.slice(0,MAX);
    shown.forEach(r=>{
      const d=sbData[r.id]||{};
      const card=document.createElement("div");
      card.className="k-card"; card.draggable=true; card.dataset.id=r.id;
      card.innerHTML="<div class='k-nom'>"+( r.nom||"(sans nom)")+"</div>\
<div class='k-tel'><a href='tel:"+r.tel+"'>"+r.tel+"</a></div>\
<div class='k-meta'><span class='k-dep'>"+r.dep+"</span>"+(d.by&&col.id!=="none"?"<span class='k-by'>"+d.by+"</span>":"")+"</div>";
      card.addEventListener("dragstart",e=>{ e.dataTransfer.setData("pid",r.id); card.classList.add("dragging"); });
      card.addEventListener("dragend",()=>card.classList.remove("dragging"));
      card.addEventListener("click",()=>openDrawer(r.id));
      container.appendChild(card);
    });
    if(cards.length>MAX){ const m=document.createElement("div"); m.className="k-more"; m.textContent="+"+(cards.length-MAX)+" autres"; container.appendChild(m); }
    if(!cards.length){ const e=document.createElement("div"); e.className="k-empty"; e.textContent="Aucun"; container.appendChild(e); }
  });
  document.getElementById("cnt-pipeline").textContent=pipeCount;
}

  const pop=document.getElementById("note-pop");
  const d=sbData[id]||{};
  document.getElementById("note-ta").value=d.note||"";
  document.getElementById("note-ta").oninput=()=>{
    document.getElementById("pop-save-info").textContent="Sauvegarde...";
    clearTimeout(noteTimer);
    noteTimer=setTimeout(()=>saveNote(id,document.getElementById("note-ta").value),800);
  };
  notePopId=id;
  const rect=e.target.getBoundingClientRect();
  pop.style.top=(rect.top-100)+"px";
  pop.style.left=Math.min(rect.left-200, window.innerWidth-280)+"px";
  pop.style.display="block";
  document.getElementById("note-ta").focus();
}
function closeNotePop(){ document.getElementById("note-pop").style.display="none"; notePopId=null; }
document.addEventListener("click",e=>{ const p=document.getElementById("note-pop"); if(p.style.display!=="none"&&!p.contains(e.target)&&!e.target.classList.contains("note-btn")) closeNotePop(); });

// ── TOOLTIP STATUT ────────────────────────────────────────────────────────
function showTip(e,id){
  const d=sbData[id]||{};
  if(!d.by||!d.at) return;
  const dt=new Date(d.at).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
  document.getElementById("tooltip").innerHTML="<div class='tooltip-row'><b>"+d.by+"</b></div><div class='tooltip-row'>"+dt+"</div>";
  document.getElementById("tooltip").style.display="block";
  document.getElementById("tooltip").style.left=e.pageX+"px";
  document.getElementById("tooltip").style.top=(e.pageY-60)+"px";
}
function hideTip(){ document.getElementById("tooltip").style.display="none"; }

// ── EXPORT CSV ────────────────────────────────────────────────────────────
function exportCSV(){
  const data=getFiltered();
  const rows=[["Nom","Telephone","Email","Site","Ville","Departement","Statut","Score","Assigne","Note"]];
  data.forEach(r=>{ const d=sbData[r.id]||{}; rows.push([r.nom,r.tel,r.email,r.site,r.ville,r.dep,ST_LBL[d.s||"none"],d.score??"",(d.assigned||""),(d.note||"")]); });
  const csv="﻿"+rows.map(r=>r.map(c=>"\""+String(c).replace(/"/g,"\"\"")+"\"").join(";")).join("\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download="prospection_export_"+new Date().toISOString().slice(0,10).replace(/-/g,"")+".csv";
  a.click();
}

// ── VIEWS ─────────────────────────────────────────────────────────────────
function showView(name, btn){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
  document.getElementById("view-"+name).classList.add("active");
  btn.classList.add("active");
  if(name==="pipeline") renderPipeline();
  if(name==="historique") loadHist();
  if(name==="stats") renderStats();
}
function updateNavCnt(){
  const p=ALL.filter(r=>{ const s=(sbData[r.id]||{}).s||"none"; return s!=="none"&&s!=="non"; }).length;
  document.getElementById("cnt-pipeline").textContent=p;
}

// ── SIDEBAR ───────────────────────────────────────────────────────────────
function buildSidebar(){
  const secC={},depC={};
  ALL.forEach(r=>{ secC[r.sec]=(secC[r.sec]||0)+1; depC[r.dep]=(depC[r.dep]||0)+1; });
  const sortedSec=Object.entries(secC).sort((a,b)=>b[1]-a[1]);
  document.getElementById("sb-secs").innerHTML=
    "<div class='si active' onclick='setSec(this,\"\")'><span>Tous</span><span class='si-cnt'>"+ALL.length+"</span></div>"+
    sortedSec.map(([s,c])=>"<div class='si' onclick='setSec(this,\""+s+"\")'><span>"+s+"</span><span class='si-cnt'>"+c+"</span></div>").join("");
  const deps=Object.keys(depC).sort();
  const sel=document.getElementById("dep-sel");
  deps.forEach(d=>{ const o=document.createElement("option"); o.value=d; o.textContent=d; sel.appendChild(o); });
  document.getElementById("sb-deps").innerHTML=deps.map(d=>
    "<div class='si' onclick='document.getElementById(\"dep-sel\").value=\""+d+"\";render()'><span>"+d+"</span><span class='si-cnt'>"+depC[d]+"</span></div>"
  ).join("");
}
function setSec(el,s){
  secFilter=s; page=0;
  document.querySelectorAll("#sb-secs .si").forEach(e=>e.classList.remove("active"));
  el.classList.add("active"); render(); renderPipeline();
}

// ── INIT ──────────────────────────────────────────────────────────────────
buildSidebar();
if(userName){
  document.getElementById("user-lbl").textContent=userName;
  document.getElementById("modal").classList.remove("show");
  Promise.all([loadAll(), loadEnrich(), loadHist()]).then(()=>connectRealtime());
} else { render(); }
</script>
